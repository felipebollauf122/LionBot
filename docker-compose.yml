services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    networks:
      - eaglenet

  eaglebot:
    build: ./server
    restart: unless-stopped
    # ATENÇÃO: este `.env` é o da RAIZ, e é o ambiente do WORKER — não o do
    # painel Next.js. `server/.env` NÃO é lido aqui (só por `npm run dev`
    # dentro de server/, que passa --env-file=.env relativo àquela pasta).
    #
    # Ou seja: as variáveis documentadas em `server/env.example` precisam
    # estar no `.env` da RAIZ pra chegarem neste container. Quem seguiu só o
    # `env.example` da raiz — que até agora só descrevia o painel — subiu o
    # worker sem GEMINI_API_KEY, e como chave vazia desativa a IA EM SILÊNCIO
    # (config.ts usa envOptional), o defeito só apareceu lá na frente, com a
    # campanha marcando "tratamento por IA falhou". Por isso o `env.example`
    # da raiz agora traz o bloco do worker junto.
    env_file: .env
    depends_on:
      - redis
    networks:
      - eaglenet

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - eaglebot
    networks:
      - eaglenet

volumes:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  eaglenet:
